<!-- ============================================================
   TIMER DE URGÊNCIA — Cole onde quiser na seção de oferta
   ============================================================ -->
<div class="offer__timer" id="countdown-timer" aria-label="Tempo restante para esta oferta">
  <p class="offer__timer-label">⏳ Oferta especial expira em:</p>
  <div class="offer__timer-display" aria-live="polite">
    <div class="offer__timer-unit">
      <span data-h>00</span>
      <small>horas</small>
    </div>
    <span class="offer__timer-sep" aria-hidden="true">:</span>
    <div class="offer__timer-unit">
      <span data-m>00</span>
      <small>min</small>
    </div>
    <span class="offer__timer-sep" aria-hidden="true">:</span>
    <div class="offer__timer-unit">
      <span data-s>00</span>
      <small>seg</small>
    </div>
  </div>
</div>
